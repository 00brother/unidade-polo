<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conheça a Unidade Polo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --amarelo:#ffc107;
    --amarelo-claro:#ffd54f;
    --amarelo-escuro:#ffb300;
    --azul:#0d47a1;
    --azul-medio:#1565c0;
    --azul-claro:#1e88e5;
    --preto:#0a0d14;
    --preto-suave:#1a1f2b;
    --branco:#ffffff;
    --cinza:#6b7280;
    --cinza-claro:#f4f6fa;
    --borda:#e8ecf3;

    --fonte:'Roboto','Segoe UI',Arial,sans-serif;

    --r-sm:14px;
    --r-md:22px;
    --r-lg:32px;

    --sh-sm:0 4px 18px rgba(13,71,161,.08);
    --sh-md:0 18px 45px rgba(13,71,161,.14);
    --sh-lg:0 35px 80px rgba(13,71,161,.22);

    --ease:cubic-bezier(.22,.7,.25,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:104px;}
  body{
    font-family:var(--fonte);
    background:var(--branco);
    color:var(--preto);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{display:block;max-width:100%;}
  a{text-decoration:none;}

  ::selection{background:var(--amarelo);color:var(--preto);}

  /* ================= SPLASH ================= */
  #splash{
    position:fixed;inset:0;
    background:var(--branco);
    display:flex;align-items:center;justify-content:center;
    z-index:9999;
    transition:opacity 1s ease, visibility 1s ease;
  }
  #splash.hide{opacity:0;visibility:hidden;}
  #splash img{
    width:520px;max-width:85vw;height:auto;
    animation:pulsarLogo 2s ease-in-out infinite;
  }
  @keyframes pulsarLogo{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }

  /* ================= TOPO (NAV + LOGO) ================= */
  header.topo{
    position:sticky;top:0;z-index:300;
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:"nav logo";
    align-items:center;
    gap:24px;
    padding:14px 28px;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid transparent;
    transition:box-shadow .35s var(--ease), border-color .35s var(--ease), padding .35s var(--ease);
  }
  header.topo.scrolled{
    box-shadow:0 10px 32px rgba(13,71,161,.12);
    border-bottom-color:var(--borda);
    padding:10px 28px;
  }

  .nav-secoes{
    grid-area:nav;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .nav-secoes a{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--preto-suave);
    background:var(--cinza-claro);
    padding:10px 20px;border-radius:100px;
    font-size:.9rem;font-weight:500;
    border:1.5px solid transparent;
    transition:.35s var(--ease);
    white-space:nowrap;
  }
  .nav-secoes a:hover,
  .nav-secoes a.ativo{
    background:var(--amarelo);
    border-color:var(--preto);
    color:var(--preto);
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(255,193,7,.35);
  }

  .topo-logo{
    grid-area:logo;
    width:66px;height:66px;object-fit:contain;
    transition:.35s var(--ease);
    justify-self:end;
  }
  header.topo.scrolled .topo-logo{width:54px;height:54px;}

  /* ================= HERO ================= */
  .hero{
    position:relative;
    min-height:clamp(520px, 82vh, 780px);
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    overflow:hidden;
    isolation:isolate;
    padding:90px 24px 110px;
  }

  .hero-bg{
    position:absolute;inset:0;z-index:-3;
    overflow:hidden;
    transform:scale(1.08);
    animation:heroZoom 18s ease-in-out infinite alternate;
  }
  @keyframes heroZoom{ from{transform:scale(1.08);} to{transform:scale(1.18);} }

  .hero-bg .slide{
    position:absolute;inset:0;
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  .hero-bg .slide.active{opacity:1;}

  .hero-overlay{
    position:absolute;inset:0;z-index:-2;
    background:
      radial-gradient(110% 90% at 50% 0%, rgba(13,71,161,.45) 0%, rgba(21,101,192,.72) 60%, rgba(30,136,229,.90) 100%),
      linear-gradient(140deg, rgba(255,193,7,.20), transparent 55%);
  }
  .hero::after{
    content:'';position:absolute;inset:auto 0 0 0;height:170px;z-index:-1;
    background:linear-gradient(to top, var(--branco), transparent);
    pointer-events:none;
  }
  .blob{
    position:absolute;border-radius:50%;filter:blur(90px);
    opacity:.55;z-index:-1;pointer-events:none;
  }
  .blob.b1{width:380px;height:380px;background:var(--amarelo);top:-90px;left:-90px;animation:float 11s ease-in-out infinite;}
  .blob.b2{width:320px;height:320px;background:var(--azul-claro);bottom:-110px;right:-70px;animation:float 14s ease-in-out infinite reverse;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-35px) scale(1.12);}
  }

  .hero-content{position:relative;max-width:880px;}

  .hero-badge{
    display:inline-flex;align-items:center;gap:9px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,193,7,.55);
    color:var(--amarelo-claro);
    padding:9px 22px;border-radius:100px;
    font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    backdrop-filter:blur(10px);
    margin-bottom:28px;
    animation:subir .9s var(--ease) both;
  }
  .hero-badge::before{
    content:'';width:8px;height:8px;border-radius:50%;
    background:var(--amarelo);
    box-shadow:0 0 0 4px rgba(255,193,7,.25);
    animation:pulsar 2s infinite;
  }
  @keyframes pulsar{
    0%,100%{box-shadow:0 0 0 4px rgba(255,193,7,.25);}
    50%{box-shadow:0 0 0 9px rgba(255,193,7,0);}
  }

  .hero h1{
    font-size:clamp(2.2rem, 6vw, 4.4rem);
    font-weight:900;
    line-height:1.1;
    letter-spacing:-.02em;
    color:var(--branco);
    text-shadow:0 4px 24px rgba(0,0,0,.25);
    margin-bottom:20px;
    animation:subir .9s .12s var(--ease) both;
  }
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(100deg,var(--amarelo) 0%,var(--amarelo-claro) 45%,#fff3c4 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hero p{
    font-size:clamp(1rem,2vw,1.2rem);
    color:rgba(255,255,255,.92);
    font-weight:400;
    line-height:1.65;
    text-shadow:0 2px 12px rgba(0,0,0,.20);
    max-width:640px;margin:0 auto 40px;
    animation:subir .9s .24s var(--ease) both;
  }
  .hero-actions{
    display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
    animation:subir .9s .36s var(--ease) both;
  }
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:16px 34px;border-radius:100px;
    font-weight:700;font-size:.98rem;
    transition:.4s var(--ease);
  }
  .btn-primary{
    background:var(--amarelo);color:var(--preto);
    box-shadow:0 14px 34px rgba(255,193,7,.42);
  }
  .btn-primary:hover{
    background:var(--amarelo-claro);
    transform:translateY(-4px);
    box-shadow:0 22px 46px rgba(255,193,7,.55);
  }
  .btn-ghost{
    background:rgba(255,255,255,.12);
    color:var(--branco);
    border:1.5px solid rgba(255,255,255,.45);
    backdrop-filter:blur(10px);
  }
  .btn-ghost:hover{
    background:var(--branco);color:var(--preto);
    border-color:var(--branco);
    transform:translateY(-4px);
  }

  @keyframes subir{
    from{opacity:0;transform:translateY(34px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ================= ESTRUTURA ================= */
  .bloco{
    max-width:1180px;
    margin:0 auto;
    padding:100px 26px;
  }
  .cabecalho{text-align:center;margin-bottom:60px;}
  .cabecalho .tag{
    display:inline-block;
    font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--azul-medio);
    background:rgba(21,101,192,.09);
    padding:8px 18px;border-radius:100px;
    margin-bottom:16px;
  }
  .cabecalho h2{
    font-size:clamp(1.75rem,4vw,2.6rem);
    font-weight:700;letter-spacing:-.01em;line-height:1.2;
    color:var(--preto);
  }
  .cabecalho h2 span{color:var(--azul-medio);}
  .cabecalho .linha{
    width:66px;height:5px;border-radius:99px;
    background:linear-gradient(90deg,var(--amarelo),var(--amarelo-escuro));
    margin:20px auto 0;
  }

  /* ================= SOBRE ================= */
  .sobre-wrap{
    background:linear-gradient(180deg,var(--cinza-claro) 0%, #fff 100%);
    border-top:1px solid var(--borda);
    border-bottom:1px solid var(--borda);
  }
  .sobre-flex{
    display:grid;
    grid-template-columns:1fr 1.1fr;
    gap:60px;align-items:center;
    max-width:1180px;margin:0 auto;
    padding:100px 26px;
  }
  .sobre-img-wrap{position:relative;}
  .sobre-img-wrap::before{
    content:'';position:absolute;inset:-18px -18px 26px 26px;
    border:3px solid var(--amarelo);
    border-radius:var(--r-lg);
    z-index:0;
  }
  .sobre-img-wrap img{
    position:relative;z-index:1;
    width:100%;border-radius:var(--r-lg);
    box-shadow:var(--sh-md);
    transition:.6s var(--ease);
  }
  .sobre-img-wrap:hover img{transform:translateY(-6px) rotate(-.6deg);}

  .sobre-txt .tag{
    display:inline-block;
    font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--azul-medio);
    background:rgba(21,101,192,.09);
    padding:8px 18px;border-radius:100px;margin-bottom:18px;
  }
  .sobre-txt h3{
    font-size:clamp(1.6rem,3.2vw,2.2rem);
    font-weight:700;line-height:1.2;letter-spacing:-.01em;
    margin-bottom:20px;
  }
  .sobre-txt h3 span{
    position:relative;
    background:linear-gradient(180deg,transparent 62%, var(--amarelo) 62%);
    padding:0 3px;
  }
  .sobre-txt p{
    color:var(--cinza);
    font-size:1rem;line-height:1.8;
    margin-bottom:16px;
  }

  .destaque-curso{
    position:relative;overflow:hidden;
    margin-top:30px;
    background:linear-gradient(135deg,var(--azul) 0%, var(--azul-medio) 55%, var(--azul-claro) 100%);
    color:#fff;
    padding:28px 30px;
    border-radius:var(--r-md);
    box-shadow:0 22px 50px rgba(13,71,161,.30);
    transition:.5s var(--ease);
  }
  .destaque-curso::before{
    content:'';position:absolute;top:-60px;right:-60px;
    width:180px;height:180px;border-radius:50%;
    background:rgba(255,193,7,.20);
    filter:blur(10px);
  }
  .destaque-curso:hover{transform:translateY(-6px);box-shadow:0 32px 65px rgba(13,71,161,.42);}
  .destaque-curso h4{
    position:relative;
    display:flex;align-items:center;gap:10px;
    font-size:1.1rem;font-weight:700;
    color:var(--amarelo);
    margin-bottom:10px;
  }
  .destaque-curso p{
    position:relative;
    color:rgba(255,255,255,.88);
    font-size:.95rem;line-height:1.7;margin:0;
  }

  /* ================= NÚMEROS ================= */
  .numeros-wrap{
    position:relative;overflow:hidden;
    background:linear-gradient(150deg,#08152e 0%, var(--azul) 55%, var(--azul-medio) 100%);
    padding:100px 0;
    isolation:isolate;
  }
  .numeros-wrap::before{
    content:'';position:absolute;top:-160px;left:-120px;
    width:460px;height:460px;border-radius:50%;
    background:rgba(255,193,7,.16);filter:blur(90px);z-index:-1;
  }
  .numeros-wrap::after{
    content:'';position:absolute;bottom:-180px;right:-140px;
    width:520px;height:520px;border-radius:50%;
    background:rgba(30,136,229,.30);filter:blur(100px);z-index:-1;
  }
  .numeros-wrap .cabecalho h2{color:var(--branco);}
  .numeros-wrap .cabecalho .tag{
    color:var(--amarelo-claro);
    background:rgba(255,193,7,.14);
  }
  .numeros-wrap .cabecalho .linha{background:linear-gradient(90deg,var(--amarelo),#fff3c4);}

  .numeros-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;max-width:1180px;margin:0 auto 55px;padding:0 26px;
  }
  .numero-card{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);
    border-radius:var(--r-md);
    padding:38px 22px;text-align:center;
    backdrop-filter:blur(12px);
    transition:.45s var(--ease);
  }
  .numero-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--amarelo),var(--amarelo-claro));
    transform:scaleX(0);transform-origin:left;
    transition:transform .5s var(--ease);
  }
  .numero-card:hover{
    transform:translateY(-10px);
    background:rgba(255,255,255,.12);
    border-color:rgba(255,193,7,.5);
    box-shadow:0 26px 50px rgba(0,0,0,.35);
  }
  .numero-card:hover::before{transform:scaleX(1);}
  .numero-card .num{
    font-size:clamp(2.4rem,5vw,3.2rem);
    font-weight:900;line-height:1.05;
    background:linear-gradient(160deg,var(--amarelo) 0%, var(--amarelo-claro) 60%, #fff6d0 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:12px;
    letter-spacing:-.02em;
  }
  .numero-card .label{
    font-size:.88rem;font-weight:500;
    color:rgba(255,255,255,.78);
    letter-spacing:.06em;text-transform:uppercase;
  }

  .grafico{
    max-width:840px;margin:0 auto;padding:0 26px;
  }
  .grafico-card{
    background:var(--branco);
    border-radius:var(--r-lg);
    padding:46px 42px;
    box-shadow:0 35px 80px rgba(0,0,0,.35);
  }
  .grafico-card h3{
    font-size:1.3rem;font-weight:700;
    color:var(--preto);margin-bottom:6px;
    text-align:center;
  }
  .grafico-card .sub{
    text-align:center;font-size:.9rem;
    color:var(--cinza);margin-bottom:34px;
  }
  .barra-item{margin-bottom:24px;}
  .barra-item:last-child{margin-bottom:0;}
  .barra-topo{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:.94rem;font-weight:500;
    color:var(--preto-suave);margin-bottom:10px;
  }
  .barra-topo .pct{
    font-size:.95rem;font-weight:700;color:var(--azul-medio);
  }
  .barra-fundo{
    height:14px;border-radius:99px;
    background:#eef1f6;overflow:hidden;
  }
  .barra-preenchida{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--amarelo-escuro),var(--amarelo),var(--amarelo-claro));
    box-shadow:0 0 14px rgba(255,193,7,.6);
    transition:width 1.5s var(--ease);
  }

  /* ================= DIFERENCIAIS ================= */
  .diferenciais-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:22px;
  }
  .diferencial{
    position:relative;overflow:hidden;
    display:flex;gap:18px;align-items:flex-start;
    background:var(--branco);
    border:1px solid var(--borda);
    border-radius:var(--r-md);
    padding:30px 28px;
    transition:.45s var(--ease);
  }
  .diferencial::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg,var(--amarelo),var(--amarelo-escuro));
    transform:scaleY(0);transform-origin:top;
    transition:transform .45s var(--ease);
  }
  .diferencial:hover{
    transform:translateY(-8px);
    border-color:transparent;
    box-shadow:var(--sh-md);
  }
  .diferencial:hover::before{transform:scaleY(1);}
  .dif-icone{
    flex-shrink:0;
    width:58px;height:58px;border-radius:16px;
    display:grid;place-items:center;
    font-size:1.6rem;
    background:linear-gradient(140deg,rgba(255,193,7,.22),rgba(255,213,79,.38));
    transition:.45s var(--ease);
  }
  .diferencial:hover .dif-icone{
    background:linear-gradient(140deg,var(--amarelo),var(--amarelo-claro));
    transform:rotate(-8deg) scale(1.06);
  }
  .diferencial h4{
    font-size:1.08rem;font-weight:700;
    margin-bottom:7px;line-height:1.35;
  }
  .diferencial p{
    font-size:.92rem;color:var(--cinza);
    line-height:1.7;
  }

  /* ================= CTA ================= */
  .cta-final{
    position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--amarelo) 0%, var(--amarelo-claro) 50%, var(--amarelo) 100%);
    padding:100px 26px;
    text-align:center;
    isolation:isolate;
  }
  .cta-final::before,
  .cta-final::after{
    content:'';position:absolute;border-radius:50%;z-index:-1;
    background:rgba(255,255,255,.35);
    filter:blur(2px);
  }
  .cta-final::before{width:320px;height:320px;top:-160px;left:-100px;}
  .cta-final::after{width:380px;height:380px;bottom:-200px;right:-120px;background:rgba(13,71,161,.10);filter:blur(4px);}

  .cta-final .tag-cta{
    display:inline-block;
    background:var(--preto);color:var(--amarelo);
    font-size:.76rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    padding:9px 20px;border-radius:100px;margin-bottom:22px;
  }
  .cta-final h2{
    font-size:clamp(1.8rem,4.5vw,2.9rem);
    font-weight:900;letter-spacing:-.02em;line-height:1.15;
    color:var(--preto);margin-bottom:16px;
  }
  .cta-final p{
    font-size:clamp(.98rem,2vw,1.12rem);
    color:rgba(10,13,20,.75);
    font-weight:400;line-height:1.65;
    max-width:600px;margin:0 auto 38px;
  }
  .cta-final .btn-cta{
    display:inline-flex;align-items:center;gap:12px;
    background:var(--preto);color:var(--amarelo);
    padding:18px 46px;border-radius:100px;
    font-weight:700;font-size:1.02rem;
    box-shadow:0 20px 40px rgba(10,13,20,.30);
    transition:.4s var(--ease);
  }
  .cta-final .btn-cta:hover{
    background:var(--branco);color:var(--preto);
    transform:translateY(-5px) scale(1.03);
    box-shadow:0 28px 55px rgba(10,13,20,.35);
  }
  .cta-final .btn-cta svg{transition:transform .4s var(--ease);}
  .cta-final .btn-cta:hover svg{transform:translateX(5px);}

  /* ================= RODAPÉ ================= */
  footer{
    background:#070d1c;
    color:var(--branco);
    padding:70px 26px 26px;
    position:relative;
    overflow:hidden;
  }
  footer::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--amarelo),var(--amarelo-claro),var(--azul-claro));
  }
  .footer-content{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1fr;
    gap:40px;
    max-width:1180px;margin:0 auto 50px;
  }
  .footer-brand img{width:56px;margin-bottom:18px;}
  .footer-brand p{
    font-size:.92rem;line-height:1.75;
    color:rgba(255,255,255,.58);
    max-width:280px;
  }
  .footer-col h4{
    font-size:.84rem;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--amarelo);
    margin-bottom:20px;
  }
  .footer-col a,
  .footer-col p{
    display:block;
    font-size:.94rem;
    color:rgba(255,255,255,.65);
    margin-bottom:11px;
    transition:.3s var(--ease);
  }
  .footer-col a:hover{
    color:var(--amarelo);
    transform:translateX(5px);
  }
  .footer-bottom{
    max-width:1180px;margin:0 auto;
    padding-top:26px;
    border-top:1px solid rgba(255,255,255,.10);
